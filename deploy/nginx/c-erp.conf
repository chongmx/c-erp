# =============================================================
# c-erp — nginx reverse proxy (Ubuntu 24.04 / GCP VM)
#
# Topology this assumes:
#   internet --TLS--> nginx :443 --plain HTTP--> 127.0.0.1:8069 (c-erp)
#   c-erp and PostgreSQL both bind loopback only.
#
# Install:
#   sudo cp c-erp.conf /etc/nginx/sites-available/c-erp
#   sudo ln -s /etc/nginx/sites-available/c-erp /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set config/system.cfg to match:
#   http_interface  = 127.0.0.1
#   secure_cookies  = True
#   trusted_proxies = 127.0.0.1,::1
# =============================================================

# ── S-40: per-client rate limiting (defence in depth) ────────
# The application limits failed logins per client IP. These zones add a
# second layer at the edge so a flood never reaches the app at all.
# Keyed on $binary_remote_addr — the real peer, before any header is
# involved, so it cannot be spoofed.
limit_req_zone $binary_remote_addr zone=c_erp_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=c_erp_general:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=c_erp_conn:10m;

upstream c_erp_backend {
    server 127.0.0.1:8069 fail_timeout=15s;
    keepalive 32;
}

# ── HTTP → HTTPS ─────────────────────────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name erp.example.com;          # ← change

    # Certbot webroot renewal must stay on plain HTTP.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ────────────────────────────────────────────────────
server {
    # Ubuntu 24.04 ships nginx 1.24, where HTTP/2 is enabled as a listen
    # PARAMETER. The standalone `http2 on;` directive only exists in 1.25.1+
    # and fails with "unknown directive" on 1.24 — nginx will not start.
    # Check with `nginx -v` and use the matching line.
    listen      443 ssl http2;            # nginx < 1.25.1  (Ubuntu 24.04 default)
    listen      [::]:443 ssl http2;
    # nginx >= 1.25.1 — use these instead and add `http2 on;` below:
    #   listen      443 ssl;
    #   listen      [::]:443 ssl;
    #   http2       on;

    server_name erp.example.com;          # ← change

    ssl_certificate     /etc/letsencrypt/live/erp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.example.com/privkey.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache         shared:c_erp_ssl:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling needs a resolver to fetch the OCSP response. Without one
    # nginx logs a warning and silently serves no staple. On GCP the metadata
    # resolver is always reachable.
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  169.254.169.254 1.1.1.1 valid=300s;
    resolver_timeout          5s;

    # HSTS — the app cannot set this itself (it never sees the TLS layer).
    # Do NOT add includeSubDomains/preload until every subdomain is HTTPS.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The app already sets X-Frame-Options, X-Content-Type-Options and CSP
    # on its own responses (HttpServer.hpp). Not duplicated here — a second
    # conflicting value is worse than one correct one.

    # CSV import is capped at 5 MB in the app (SEC-16); allow a little
    # headroom for multipart overhead and reject anything larger at the edge.
    client_max_body_size 6m;
    client_body_timeout  60s;

    # PDF generation has a 30 s timeout inside the app (ProcessRunner).
    # Give the proxy more than that so nginx never times out first and
    # masks the real error.
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;
    proxy_connect_timeout 5s;

    limit_conn c_erp_conn 32;

    gzip              on;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length   1024;
    gzip_proxied      any;

    access_log /var/log/nginx/c-erp.access.log;
    error_log  /var/log/nginx/c-erp.error.log warn;

    # ── Shared proxy headers ─────────────────────────────────
    # S-40 — this block is what makes per-client rate limiting work.
    #
    # $proxy_add_x_forwarded_for APPENDS $remote_addr to any X-Forwarded-For
    # the client sent:
    #     client sends nothing   ->  "203.0.113.7"
    #     client sends "1.2.3.4" ->  "1.2.3.4, 203.0.113.7"
    # The application reads the LAST element, which is the address nginx
    # actually observed and the only one a client cannot forge.
    #
    # X-Real-IP is set unconditionally from $remote_addr, overwriting any
    # client-supplied value, and the app prefers it. Between the two, a
    # client cannot choose its own rate-limit bucket.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    # Required for the upstream `keepalive 32` to actually take effect: nginx
    # sends "Connection: close" to the upstream unless this is cleared, so
    # without it every request opens a fresh TCP connection to the app and the
    # keepalive pool is dead weight.
    proxy_set_header Connection        "";

    # ── Login endpoints: tight limit ─────────────────────────
    # burst=5 nodelay lets a human retry a typo without being throttled,
    # while still capping automated attempts at 10/min.
    location = /web/session/authenticate {
        limit_req zone=c_erp_login burst=5 nodelay;
        proxy_pass http://c_erp_backend;
    }

    location = /portal/api/login {
        limit_req zone=c_erp_login burst=5 nodelay;
        proxy_pass http://c_erp_backend;
    }

    # ── WebSocket ────────────────────────────────────────────
    location /websocket {
        proxy_pass http://c_erp_backend;

        # nginx inherits proxy_set_header from the enclosing block ONLY when
        # the current block defines none of its own. Because this location sets
        # Upgrade/Connection, every header from the server block is dropped
        # here — including X-Real-IP and X-Forwarded-For — so they must all be
        # repeated. This is a classic silent misconfiguration: WebSocket works,
        # but the app sees 127.0.0.1 on that path only.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 3600s;      # long-lived; must exceed idle time
    }

    # ── Everything else ──────────────────────────────────────
    location / {
        limit_req zone=c_erp_general burst=60 nodelay;
        proxy_pass http://c_erp_backend;
        proxy_buffering on;
    }

    # Optional: serve the OWL frontend straight from disk instead of
    # proxying it. Measurable win, but verify the URL prefix the app uses
    # for static assets before enabling — a wrong alias silently 404s the
    # whole UI.
    #
    # location /static/ {
    #     alias /opt/c-erp/web/static/;
    #     expires 1h;
    #     add_header Cache-Control "public";
    #     access_log off;
    # }
}

# =============================================================
# Multi-tenant (docs/040 §2): one server block per company,
# each proxying to that tenant's own process and database.
#
#   upstream c_erp_acme   { server 127.0.0.1:8069; keepalive 32; }
#   upstream c_erp_globex { server 127.0.0.1:8070; keepalive 32; }
#
#   server { server_name acme.erp.example.com;   ... proxy_pass http://c_erp_acme;   }
#   server { server_name globex.erp.example.com; ... proxy_pass http://c_erp_globex; }
#
# Cookies scope per subdomain, so tenant sessions are isolated with no
# extra work. Do NOT widen the cookie to the parent domain to make admin
# switching seamless — that recouples the tenants and, combined with the
# open session-fixation finding (S-42), would let a session minted on one
# tenant be replayed against another.
# =============================================================
