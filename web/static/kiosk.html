<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>Clock In / Out</title>
<style>
  :root {
    --bg:#0f1620; --card:#18222e; --line:#26333f;
    --ink:#e9eff4; --muted:#8ea0b0;
    --in:#1f9d6b; --out:#c2603a; --accent:#3aa8bd; --err:#d5544d;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; align-items:center; justify-content:center;
    -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .card {
    width:min(420px, 94vw); background:var(--card);
    border:1px solid var(--line); border-radius:14px;
    padding:26px 24px 22px; text-align:center;
  }
  h1 { margin:0 0 2px; font-size:1.15rem; font-weight:650; letter-spacing:-.01em; }
  .clock { margin:0 0 20px; color:var(--muted); font-size:.9rem; font-variant-numeric:tabular-nums; }

  .dots { display:flex; gap:11px; justify-content:center; margin:0 0 22px; height:16px; }
  .dots i {
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--line); background:transparent; display:block;
  }
  .dots i.on { background:var(--accent); border-color:var(--accent); }

  .pad { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  button {
    font:inherit; font-size:1.5rem; font-weight:600;
    padding:16px 0; border-radius:10px; cursor:pointer;
    background:#22303e; color:var(--ink); border:1px solid var(--line);
    font-variant-numeric:tabular-nums;
  }
  button:active { background:var(--accent); border-color:var(--accent); color:#08191d; }
  button.util { font-size:.95rem; font-weight:600; color:var(--muted); }
  button:disabled { opacity:.45; cursor:default; }

  .msg {
    margin:18px 0 0; min-height:76px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:4px;
  }
  .msg .who { font-size:1.2rem; font-weight:680; }
  .msg .what { font-size:.95rem; }
  .msg .hrs { font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; }
  .in   .what { color:var(--in); }
  .out  .what { color:var(--out); }
  .err  .what { color:var(--err); }
  .hint { margin:14px 0 0; font-size:.75rem; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <h1>Clock In / Out</h1>
  <p class="clock" id="clock">&nbsp;</p>

  <div class="dots" id="dots"></div>

  <div class="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="util" data-k="clear">Clear</button>
    <button data-k="0">0</button>
    <button class="util" data-k="enter" id="enter">Enter</button>
  </div>

  <div class="msg" id="msg"></div>
  <p class="hint">Enter your PIN, then press Enter.</p>
</div>

<script>
(function () {
  // The kiosk holds NO session and knows nothing about who works here. It
  // sends a PIN and renders whatever the server says about that one person.
  var MAXLEN = 12, pin = '', busy = false, resetTimer = null;
  var dots = document.getElementById('dots');
  var msg  = document.getElementById('msg');

  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent =
      d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour:'2-digit', minute:'2-digit' });
  }
  tick(); setInterval(tick, 10000);

  function drawDots() {
    dots.innerHTML = '';
    for (var i = 0; i < Math.max(pin.length, 4); i++) {
      var d = document.createElement('i');
      if (i < pin.length) d.className = 'on';
      dots.appendChild(d);
    }
  }
  function clearPin() { pin = ''; drawDots(); }

  function show(cls, who, what, hrs) {
    msg.className = 'msg ' + cls;
    msg.innerHTML = '';
    if (who)  { var a = document.createElement('div'); a.className = 'who';  a.textContent = who;  msg.appendChild(a); }
    if (what) { var b = document.createElement('div'); b.className = 'what'; b.textContent = what; msg.appendChild(b); }
    if (hrs)  { var c = document.createElement('div'); c.className = 'hrs';  c.textContent = hrs;  msg.appendChild(c); }
    clearTimeout(resetTimer);
    // Wipe the result after a few seconds so the next person does not see the
    // previous person's name and hours.
    resetTimer = setTimeout(function () { msg.className = 'msg'; msg.innerHTML = ''; }, 6000);
  }

  async function submit() {
    if (busy || pin.length < 4) return;
    busy = true;
    document.getElementById('enter').disabled = true;
    var sent = pin;
    clearPin();
    try {
      var r = await fetch('/kiosk/api/punch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: sent }),
      });
      var d = await r.json().catch(function () { return {}; });
      if (!r.ok || d.error) {
        show('err', '', d.error || 'Could not read that PIN', '');
      } else {
        var isIn = d.state === 'checked_in';
        show(isIn ? 'in' : 'out', d.name,
             isIn ? 'Checked in' : 'Checked out',
             'Today: ' + (d.worked_hours_today || 0).toFixed(2) + ' h');
      }
    } catch (e) {
      show('err', '', 'No connection to the server', '');
    }
    busy = false;
    document.getElementById('enter').disabled = false;
  }

  document.querySelector('.pad').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var k = b.dataset.k;
    if (k === 'clear')      clearPin();
    else if (k === 'enter') submit();
    else if (pin.length < MAXLEN) { pin += k; drawDots(); }
  });

  // A USB badge reader types digits and presses Enter — so it works here with
  // no extra code, which is why the PIN field accepts up to 12 characters.
  document.addEventListener('keydown', function (ev) {
    if (ev.key >= '0' && ev.key <= '9' && pin.length < MAXLEN) { pin += ev.key; drawDots(); }
    else if (ev.key === 'Enter')     submit();
    else if (ev.key === 'Backspace') { pin = pin.slice(0, -1); drawDots(); }
    else if (ev.key === 'Escape')    clearPin();
  });

  drawDots();
})();
</script>
</body>
</html>
