<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>odoo-cpp</title>
    <!-- OWL — served locally from web/static/lib/ -->
    <script src="/lib/owl.iife.js"></script>
    <link rel="stylesheet" href="/src/app.css">
    <link rel="stylesheet" href="/src/components/rental/rental.css">
    <link rel="stylesheet" href="/src/components/partkeepr.css">
    <link rel="stylesheet" href="/src/components/dbstudio.css">
    <link rel="stylesheet" href="/src/components/recordviews.css">
    <link rel="stylesheet" href="/src/components/partlookup.css">
    <link rel="stylesheet" href="/src/components/partcatalog.css">
    <link rel="stylesheet" href="/src/components/project.css">
    <link rel="stylesheet" href="/src/components/help.css">
    <link rel="stylesheet" href="/src/components/bomeditor.css">
    <link rel="stylesheet" href="/src/components/m2oselect.css">
</head>
<body>
<div id="app"></div>
<script src="/src/services/rpc.js"></script>
<script src="/src/components/LoginPage.js"></script>
<script src="/src/components/UserMenu.js"></script>
<script src="/src/components/DatePicker.js"></script>
<!-- M2OSelect — the shared many-to-one picker. Must load before every screen
     that names it in `static components`, which by now is most of them. -->
<script src="/src/components/M2OSelect.js"></script>
<!-- Rental components load BEFORE app.js, which is what lets app.js
     reference RentalUnitGrid in its CUSTOM_VIEWS map at definition time. -->
<script src="/src/components/rental/RentalUnitGrid.js"></script>
<script src="/src/components/rental/RentalDashboard.js"></script>
<script src="/src/components/rental/RentalDemoData.js"></script>
<!-- Custom screens for the new modules — load before app.js so its
     CUSTOM_VIEWS map can reference them at definition time. -->
<script src="/src/components/BarcodeScan.js"></script>
<script src="/src/components/BankReconcile.js"></script>
<script src="/src/components/CompanyAdmin.js"></script>
<script src="/src/components/DbBackups.js"></script>
<script src="/src/components/WebsitePages.js"></script>
<script src="/src/components/DbStudio.js"></script>
<!-- docs/095 — generic views. Must load BEFORE app.js: ActionView names these
     classes in its `static components` map, which is evaluated at definition time. -->
<script src="/src/components/RecordViews.js"></script>
<script src="/src/components/PartLookup.js"></script>
<script src="/src/components/PartCatalog.js"></script>
<script src="/src/components/CategoryTree.js"></script>
<script src="/src/components/AiSettings.js"></script>
<script src="/src/components/TaskBoard.js"></script>
<script src="/src/components/TimesheetGrid.js"></script>
<script src="/src/components/HelpCenter.js"></script>
<script src="/src/components/BomEditor.js"></script>
<script src="/src/components/AccountReports.js"></script>
<script src="/src/app.js"></script>
</body>
</html>
