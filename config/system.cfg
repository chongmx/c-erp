[options]

; ── Database ──────────────────────────────────────────────────────────────────
db_host     = localhost
db_port     = 5432
db_name     = odoo
db_user     = odoo
db_password = odoo
db_maxconn  = 10

; ── HTTP server ───────────────────────────────────────────────────────────────
; Production: bind loopback only — nginx is the sole ingress.
http_interface = 127.0.0.1
http_port      = 8069
workers        = 4

; Set the Secure flag on the session cookie. Must be true whenever nginx
; serves the site over HTTPS (i.e. always, in production).
secure_cookies = True

; S-40: reverse proxies whose X-Forwarded-For / X-Real-IP we trust for
; per-client rate limiting. Only the immediate peer is checked against this
; list. Leave as loopback when nginx runs on the same host.
; Set to False to disable header trust entirely (direct-exposure setups).
trusted_proxies = 127.0.0.1,::1

; ── Static file serving ───────────────────────────────────────────────────────
http_doc_root  = web/static
http_index     = index.html

; ── Logging ───────────────────────────────────────────────────────────────────
log_level  = info
logfile    = log/system.log

; ── SMTP (mail) ───────────────────────────────────────────────────────────────
smtp_server   = localhost
smtp_port     = 25
smtp_ssl      = False
smtp_user     = False
smtp_password = False
email_from    = False

; Idle session lifetime in minutes. Sessions expire this long after last use
; and are reclaimed by the eviction timer (S-43). Lower = smaller window for a
; stolen session id; higher = fewer surprise logouts.
session_ttl_minutes = 60
